<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Learning center seal">
  <!-- Placeholder seal. Replace per client; path is set in src/config/brand.js -->
  <defs>
    <path id="ring" d="M100,100 m-70,0 a70,70 0 1,1 140,0 a70,70 0 1,1 -140,0" />
  </defs>
  <circle cx="100" cy="100" r="96" fill="#FFB703" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#023047" stroke-width="1.5" />
  <circle cx="100" cy="100" r="52" fill="#FFFFFF" />
  <circle cx="100" cy="100" r="52" fill="none" stroke="#023047" stroke-width="3" />
  <text fill="#023047" font-family="Nunito Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">
    <!-- textLength: whatever font the browser falls back to, spacing stretches or squeezes to fill the ring (2πr ≈ 440) without overlapping --><textPath href="#ring" startOffset="0" textLength="430" lengthAdjust="spacing">LEARNING CENTER • KNOWLEDGE • GROWTH •</textPath>
  </text>
  <!-- center mark: open book with a sprouting leaf -->
  <g fill="none" stroke="#023047" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 118 q15 -8 30 0 q15 -8 30 0 v-30 q-15 -8 -30 0 q-15 -8 -30 0 z" />
    <path d="M100 88 v30" />
  </g>
  <path d="M100 86 q-2 -16 14 -22 q2 16 -14 22 z" fill="#219EBC" />
</svg>
