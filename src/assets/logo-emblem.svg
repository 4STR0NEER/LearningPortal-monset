<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Learning center seal">
  <!-- Placeholder seal. Replace per client; path is set in src/config/brand.js -->
  <defs>
    <path id="ring" d="M100,100 m-70,0 a70,70 0 1,1 140,0 a70,70 0 1,1 -140,0" />
  </defs>
  <circle cx="100" cy="100" r="96" fill="#0E6973" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#BAD9CE" stroke-width="1.5" />
  <circle cx="100" cy="100" r="52" fill="#F7FAF9" />
  <circle cx="100" cy="100" r="52" fill="none" stroke="#F2BB16" stroke-width="3" />
  <text fill="#F7FAF9" font-family="Nunito Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3.2">
